name: build

# Compile the firmware with arduino-cli. We build in CI rather than locally
# because the ESP32 toolchain is ~1.5 GB and this machine's network blocks
# raw.githubusercontent.com, which is where arduino-cli fetches the tools from.

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 1.5.1 is the newest *stable* release. There is no 1.5.2 on
  # downloads.arduino.cc -- `latest` currently serves 1.5.2-rc.1, and asking
  # for a version that has no release tarball just 404s.
  ARDUINO_CLI_VERSION: 1.5.1
  ESP32_CORE_VERSION: 3.3.12

  # Must be 5.x. AcidBox's vendored src/usbmidi uses
  # MidiType::SystemExclusiveStart / SystemExclusiveEnd, and that pair of names
  # only exists in 5.0.0 and later -- 4.x spells the 0xF0 status byte
  # MidiType::SystemExclusive and has no end marker at all, so 4.x fails to
  # compile in USB-MIDI.h and USB-MIDI_defs.h.
  #
  # 5.0.0 is co-authored by lathoub, who wrote the vendored USB-MIDI
  # transport, so 5.x is the version that transport was written against.
  MIDI_LIB_VERSION: 5.0.2

  SKETCH_DIR: firmware/AcidBox

  # LittleFS image geometry. Read out of the partition table rather than
  # hardcoded, so changing PartitionScheme cannot silently desync the two:
  #   tools/partitions/noota_3g.csv -> spiffs at 0x110000, size 0x2E0000
  #
  # block_size 4096 matches what arduino-esp32's LittleFSFS::begin() asks for.
  # It passes an empty esp_vfs_littlefs_conf_t and sets only grow_on_mount =
  # true, leaving the IDF wrapper on its 4096 default. mklittlefs must be told
  # the same number or the image will not mount -- and because config.h sets
  # FORMAT_LITTLEFS_IF_FAILED true, a failed mount silently reformats the
  # partition and erases the drum kits instead of reporting the problem.
  FS_BLOCK_SIZE: 4096
  FS_PARTITION_LABEL: spiffs
  FS_PARTITION_SIZE: 3014656     # 0x2E0000

  # Where the 2.5 MB of drum samples come from. They are not committed here
  # (see .gitignore) but they are not secret either -- they are fetched from
  # the pinned upstream commit so the image is byte-reproducible.
  ACIDBOX_REPO: https://github.com/copych/AcidBox.git
  ACIDBOX_BRANCH: S3-regular

  MKLITTLEFS_VERSION: 4.1.0

  # Board: ESP32S3 Dev Module, as the AcidBox README specifies.
  #
  #   PSRAM=opi          OPI PSRAM. config.h enables PRELOAD_ALL, whose
  #                      PSRAM_SAMPLER_CACHE is 3 MB, so QSPI is not enough.
  #   PartitionScheme    The README says "No OTA (1MB APP / 3MB SPIFFS)". In
  #   =noota_3g          core 2.x that menu entry was spelled "min_spiffs", but
  #                      in 3.x `min_spiffs` means something else entirely
  #                      ("Minimal SPIFFS, 1.9MB APP with OTA / 128KB SPIFFS")
  #                      and the option we want is `noota_3g`. Getting this
  #                      wrong fails silently -- it compiles, it just cannot
  #                      hold the 2.5 MB of drum kits.
  #   FlashSize=16M      Flash size of the target board. Raise if yours differs.
  #   USBMode=hwcdc      M0, and hardware-driven rather than chosen. The bench board
  #                      exposes only the native USB-OTG port, with no USB-UART bridge,
  #                      so config.h's DEBUG_PORT (= Serial = UART0 on GPIO43/44) has
  #                      nothing to reach. hwcdc puts a CDC console on that port so the
  #                      one cable carries the log. Costs USB MIDI: on ESP32-S3 the
  #                      USB-Serial-JTAG and USB-OTG peripherals share GPIO19/20 and a
  #                      single PHY, so a CDC console and TinyUSB MIDI cannot coexist
  #                      there. MIDI_USB_DEVICE is off in config.h to match. Drop both
  #                      once a CP2102/CH343 module is wired to GPIO43/44.
  # The merged-image step parses PartitionScheme= out of this FQBN to find the
  # core's partition CSV, then derives every flash offset from that CSV. So the
  # FQBN stays the single source of truth: change the scheme here and the merge
  # follows, with nothing to keep in sync by hand.
  FQBN: esp32:esp32:esp32s3:PSRAM=opi,PartitionScheme=noota_3g,FlashSize=16M,USBMode=hwcdc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache arduino-cli and the ESP32 core
        # The ESP32 toolchain is ~1.5 GB, so this cache is what keeps a run
        # down to a few minutes instead of ten.
        #
        # The key deliberately excludes firmware content. A sketch edit does not
        # invalidate the toolchain, and hashing firmware/** would throw away a
        # 1.5 GB download on every source change -- exactly the iteration this
        # workflow exists to make cheap. Bumping a version in env: does change
        # the key, which is the case that genuinely needs a fresh install.
        uses: actions/cache@v6
        with:
          # ~/.arduino15 holds packages/, staging/ and the library index -- the
          # whole ~1.5 GB toolchain. The arduino-cli binary itself is only a few
          # MB and is reinstalled each run, which keeps a version bump from
          # needing a cache invalidation.
          path: |
            ~/.arduino15
            ~/Arduino
          key: arduino-${{ env.ESP32_CORE_VERSION }}-${{ env.MIDI_LIB_VERSION }}
          restore-keys: |
            arduino-${{ env.ESP32_CORE_VERSION }}-

      - name: Install arduino-cli
        run: |
          # The tarball holds a bare `arduino-cli` at its root. Extracting to
          # /usr/local drops it in /usr/local/arduino-cli, which is not on PATH
          # -- so link it into bin explicitly rather than assuming.
          tmp=$(mktemp -d)
          curl -fsSL "https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
            | tar -xz -C "$tmp"
          sudo install -m 0755 "$tmp/arduino-cli" /usr/local/bin/arduino-cli
          rm -rf "$tmp"
          arduino-cli version

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Install MIDI Library
        # Forty Seven Effects' arduino_midi_library. The Library Manager name
        # is "MIDI Library", not "arduino_midi_library" (the repo name).
        run: arduino-cli lib install "MIDI Library@${MIDI_LIB_VERSION}"

      - name: Show resolved board options
        run: arduino-cli board details -b esp32:esp32:esp32s3

      - name: Show how USBMode reaches Serial
        # M0. config.h sets DEBUG_PORT = Serial, and on this board that only reaches
        # the user if the core redirects Serial onto the CDC when USBMode=hwcdc.
        # Compiling either way, so a green build does NOT prove the log will appear.
        # Print the evidence from the exact pinned core instead of assuming it: if
        # this run shows no "define Serial", then a silent log is a wiring/config
        # fact rather than a mystery, and HWCDC is the fallback to wire up.
        run: |
          core=$(find ~/.arduino15/packages/esp32/hardware/esp32 -maxdepth 2 -name boards.txt -print -quit | xargs dirname)
          echo "core root: ${core:-NOT FOUND}"
          echo "--- esp32s3 USBMode menu entries ---"
          grep -E '^esp32s3\.menu\.USBMode\.' "${core}/boards.txt" || echo "(no USBMode menu for esp32s3)"
          echo "--- esp32s3 CDCOnBoot menu entries ---"
          grep -E '^esp32s3\.menu\.CDCOnBoot\.' "${core}/boards.txt" || echo "(no CDCOnBoot menu for esp32s3)"
          echo "--- where Serial is defined ---"
          grep -rn 'define[[:space:]]\+Serial' "${core}/cores/esp32/" || echo "(no 'define Serial' in cores/esp32)"
          echo "--- ARDUINO_USB_MODE guards ---"
          grep -rn 'ARDUINO_USB_MODE' "${core}/cores/esp32/HWCDC.h" || echo "(HWCDC.h absent, or no ARDUINO_USB_MODE in it)"

      - name: Check TinyUSB MIDI is compiled in
        # MIDIUSB_ESP32.h is wrapped in #if CONFIG_TINYUSB_MIDI_ENABLED. If the
        # prebuilt sdkconfig has it off, the class disappears and
        # USBMIDI_CREATE_INSTANCE fails to compile with a confusing error.
        # Report it explicitly so a failure here is never a mystery.
        run: |
          for sdk in $(find ~/.arduino15/packages/esp32 -name sdkconfig.h | sort); do
            if grep -q 'CONFIG_IDF_TARGET_ESP32S3' "$sdk"; then
              echo "=== $sdk ==="
              grep -E 'TINYUSB' "$sdk" || echo "  (no TINYUSB config at all)"
              break
            fi
          done

      - name: Compile
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn "$FQBN" \
            --warnings default \
            --clean \
            --export-binaries \
            --build-path "${{ runner.temp }}/build" \
            "$SKETCH_DIR" 2>&1 | tee build.log

      - name: Report errors, warnings and sketch size
        if: always()
        run: |
          echo "--- errors ---"
          grep -E '^[^ ]+:[0-9]+:[0-9]+: error:' build.log || echo "(none)"
          echo "--- error count ---"
          grep -cE ': error:' build.log || echo 0
          echo "--- warnings from our own sketch ---"
          grep 'warning:' build.log | grep -F "$SKETCH_DIR" || echo "(none)"
          echo "--- sketch size ---"
          grep -E 'Sketch uses|Global variables' build.log || echo "(not in log)"

      - name: Assemble the flash bundle
        if: success()
        run: |
          # --export-binaries leaves bootloader.bin / partitions.bin and the
          # application binary in the build path, but boot_app0.bin lives in
          # the core's tools/partitions/ and is never copied over. Without it
          # the otadata partition is never initialised, and people copy
          # 0xe0000 from other tutorials -- which is wrong here, because
          # noota_3g gives nvs 0x5000 instead of 0x4000 and pushes otadata up
          # by 4 KB.
          #
          # Rather than trust anyone (including this file) to remember four
          # hex offsets, derive them and ship a ready-to-paste command line.
          set -euo pipefail
          build="${{ runner.temp }}/build"

          # -print -quit, not `find ... | head -1`: head closing the pipe early
          # kills find with SIGPIPE, which pipefail turns into a step failure.
          boot_app0=$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin -print -quit)
          if [ -z "$boot_app0" ]; then
            echo "::error::boot_app0.bin not found in the installed core -- flash offsets unknown"
            exit 1
          fi
          cp "$boot_app0" "$build/boot_app0.bin"
          echo "boot_app0.bin: $boot_app0 ($(stat -c%s "$boot_app0") bytes)"

          # What arduino-cli 1.5.1 + core 3.3.12 actually leaves in the build
          # path, and why none of it can be hardcoded:
          #
          #   AcidBox.ino.bin             the application
          #   AcidBox.ino.bootloader.bin  core-prefixed
          #   AcidBox.ino.partitions.bin  core-prefixed
          #   AcidBox.ino.merged.bin      16 MiB, arduino-cli's own merge
          #
          # So the app is AcidBox.ino.bin, not AcidBox.bin and not
          # firmware.bin -- three wrong guesses in a row before reading the
          # directory. Match on the suffix instead: the app is the one .bin
          # that is not a bootloader, a partition table, a merged image or
          # the otadata blob we just copied in.
          shopt -s nullglob
          app_bins=()
          for f in "$build"/*.bin; do
            case "$(basename "$f")" in
              boot_app0.bin|*.bootloader.bin|*.partitions.bin|*.merged.bin) ;;
              *) app_bins+=("$(basename "$f")") ;;
            esac
          done
          shopt -u nullglob
          if [ "${#app_bins[@]}" -ne 1 ]; then
            echo "::error::expected exactly one application .bin in $build, found: ${app_bins[*]:-none}"
            ls -l "$build"/*.bin || true
            exit 1
          fi
          src_bin="${app_bins[0]}"

          # Normalise all three to the names the docs and flash-args.txt use.
          # arduino-cli's names are baked into the board's flash layout and
          # are not what anyone should be typing; the artifact is.
          for kind in bootloader partitions; do
            hits=("$build"/*."$kind".bin)
            if [ "${#hits[@]}" -ne 1 ]; then
              echo "::error::expected exactly one .$kind.bin in $build, found: ${hits[*]:-none}"
              ls -l "$build"/*.bin || true
              exit 1
            fi
            mv "${hits[0]}" "$build/$kind.bin"
          done
          mv "$build/$src_bin" "$build/firmware.bin"
          # The sketch-prefixed merged image is arduino-cli's own, sized to the
          # whole 16 MiB of flash. The merge step builds a 4 MiB one and uses
          # this to confirm its offsets. Kept out of the artifact: it is 4x
          # the download for no benefit to whoever is flashing.
          merged_src=("$build"/*.merged.bin)
          if [ "${#merged_src[@]}" -eq 1 ]; then
            mv "${merged_src[0]}" "$build/arduino-cli-merged.bin"
          else
            echo "::warning::no arduino-cli merged image to cross-check offsets against"
          fi
          echo "application binary: $src_bin -> firmware.bin ($(stat -c%s "$build/firmware.bin") bytes)"

          # Offsets below match tools.esptool_py.upload.pattern_args in the
          # core's platform.txt, which is the authority -- not this comment.
          cat > "$build/flash-args.txt" <<'EOF'
          Replace <COM> with your port, e.g. COM5. Install esptool with:
            pip install esptool
          The core pins esptool 5.3.1, so subcommands are hyphenated.
          Use `python -m esptool` so the entry-point name does not matter.

          python -m esptool --chip esp32s3 --port <COM> --baud 921600 \
            --before default-reset --after hard-reset \
            write-flash --flash-mode keep --flash-freq keep --flash-size keep \
            0x0 bootloader.bin 0x8000 partitions.bin \
            0xe000 boot_app0.bin 0x10000 firmware.bin
          EOF

          # Checksums so the download can be verified. Windows has certutil,
          # macOS/Linux have shasum, so this needs no extra tooling either way.
          # The 16 MiB cross-check image is left out: it is not in the
          # artifact, so a checksum for it would send people looking for it.
          ( cd "$build" && sha256sum bootloader.bin partitions.bin \
                           boot_app0.bin firmware.bin > SHA256SUMS.txt )

          ls -l "$build"/*.bin "$build"/*.txt

      - name: Build the LittleFS drum kit image
        if: success()
        run: |
          # AcidBox reads its drum kits from a 3 MB LittleFS partition at
          # runtime (sampler.ino:119). The kits are ~2.55 MB, so the image has
          # to be built from the real upstream samples -- the firmware only
          # carries a 256 KB set of 8-bit fallbacks in samples.h.
          set -euo pipefail
          out="${{ runner.temp }}/littlefs"

          # mklittlefs is NOT in the esp32 core -- arduino-esp32 ships
          # boot_app0.bin and the partition CSVs under tools/partitions, but
          # no filesystem builder. Take the prebuilt from earlephilhower.
          curl -fsSL -o mklittlefs.tar.gz \
            "https://github.com/earlephilhower/mklittlefs/releases/download/${MKLITTLEFS_VERSION}/x86_64-linux-gnu-mklittlefs-42acb97.tar.gz"
          tar -xzf mklittlefs.tar.gz
          mk=$(find . -name mklittlefs -type f -print -quit)
          if [ -z "$mk" ]; then
            echo "::error::mklittlefs not found inside the ${MKLITTLEFS_VERSION} tarball"
            exit 1
          fi
          install -m 0755 "$mk" /usr/local/bin/mklittlefs
          mklittlefs --version || true

          git clone --depth 1 --branch "$ACIDBOX_BRANCH" "$ACIDBOX_REPO" acidbox
          echo "upstream data/ commit: $(git -C acidbox rev-parse --short HEAD)"

          mkdir -p "$out"
          # mklittlefs exits non-zero if the tree does not fit, which is the
          # outcome we want: better a red build than an image that only mounts
          # on paper. The margin is printed either way.
          if ! mklittlefs -c acidbox/data \
                          -p "$FS_BLOCK_SIZE" \
                          -b "$FS_BLOCK_SIZE" \
                          -s "$FS_PARTITION_SIZE" \
                          "$out/littlefs.bin" 2>&1 | tee mklittlefs.log; then
            echo "::error::drum kits do not fit the $FS_PARTITION_SIZE byte $FS_PARTITION_LABEL partition"
            echo "::error::drop a kit from AcidBox/data/ or switch to a partition scheme with more filesystem"
            exit 1
          fi

          # mklittlefs always pads the image out to -s, so the image file is
          # exactly FS_PARTITION_SIZE bytes no matter how full it really is.
          # Its size therefore carries zero information about headroom -- the
          # only honest measure is how many bytes of samples went in.
          raw=$(find acidbox/data -type f -printf '%s\n' | awk '{t+=$1} END {print t+0}')
          blocks=$(find acidbox/data -type f -printf '%s\n' \
                   | awk -v b="$FS_BLOCK_SIZE" '{t += int(($1 + b - 1) / b) * b} END {print t+0}')
          n=$(find acidbox/data -type f | wc -l)

          echo "sample files              : $n"
          echo "raw bytes                 : $raw"
          echo "block-aligned bytes       : $blocks"
          echo "partition ($FS_PARTITION_LABEL): $FS_PARTITION_SIZE bytes"
          echo "nominal headroom          : $((FS_PARTITION_SIZE - blocks)) bytes (before FS metadata)"
          echo "image sha256              : $(sha256sum "$out/littlefs.bin" | cut -d' ' -f1)"

          echo "FS_CONTENT_RAW=$raw"     >> "$GITHUB_ENV"
          echo "FS_CONTENT_BLOCKS=$blocks" >> "$GITHUB_ENV"
          echo "FS_FILE_COUNT=$n"         >> "$GITHUB_ENV"

      - name: Merge everything into one flashable image
        if: success()
        run: |
          # Five files at five addresses is a five-row table in a browser
          # flasher, and every row is a chance to typo an address. But
          # noota_3g lays flash out as one unbroken span:
          #
          #   bootloader  0x0       0x8000
          #   partitions  0x8000    0x9000
          #   nvs         0x9000    0xe000
          #   otadata     0xe000    0x10000
          #   app0        0x10000   0x110000
          #   spiffs      0x110000  0x3F0000
          #   coredump    0x3F0000  0x400000
          #
          # Nothing is imported between 0x0 and the end of coredump, so the
          # whole thing collapses into a single 4 MiB image flashed at 0x0.
          # One download, one row, one button.
          #
          # Offsets are parsed out of the core's own partition CSV rather
          # than written here. The 0xe000 vs 0xe0000 trap is exactly the
          # kind of thing that goes stale silently when it lives in a
          # comment; if the partition scheme ever changes, this follows.
          # The scheme name comes from the FQBN, which is what arduino-cli
          # actually built with -- so there is one source of truth.
          set -euo pipefail
          command -v python3 >/dev/null || { echo "::error::python3 missing on runner"; exit 1; }

          mkdir -p "${{ runner.temp }}/merged"
          # Everything below, including finding the partition CSV, happens in
          # one python process. Doing it in shell meant a here-string, a sed
          # and a find over the whole core tree -- three ways to fail for
          # reasons that never reach the log as anything readable.
          #
          # The four file names are the normalised ones the bundle step
          # settled on, so there is nothing to rediscover here.
          #
          # It also means every diagnostic has to go to STDOUT. GitHub only
          # turns ::error:: lines on stdout into annotations on the commit
          # page; the same text on stderr is just "Process completed with
          # exit code 1". sys.exit("::error::...") is stderr, so a real
          # diagnosis used to be invisible exactly when it was needed.
          python3 tools/merge-image.py \
                   "$FQBN" \
                   "$HOME/.arduino15/packages/esp32/hardware/esp32" \
                   "${{ runner.temp }}/build" \
                   "${{ runner.temp }}/littlefs/littlefs.bin" \
                   "${{ runner.temp }}/merged/merged.bin" > merge-report.md
          cat merge-report.md
          {
            echo "### One-file flash image"
            echo
            cat merge-report.md
          } >> "$GITHUB_STEP_SUMMARY"

          ls -l "${{ runner.temp }}/merged/merged.bin"
          cp merge-report.md "${{ runner.temp }}/merged/README.md"

      - name: Upload merged image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: AcidDripS3-merged
          path: ${{ runner.temp }}/merged/*
          if-no-files-found: error

      - name: Upload firmware binary
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: AcidDripS3-firmware
          # *.txt as well as *.bin: flash-args.txt is the paste-ready
          # command line and SHA256SUMS.txt verifies the download. An
          # earlier version globbed only *.bin and quietly shipped neither,
          # while the docs promised flash-args.txt was in there.
          #
          # arduino-cli-merged.bin is excluded: it is arduino-cli's own
          # 16 MiB whole-flash image, kept only so the merge step can confirm
          # its offsets. Nobody needs to download it.
          path: |
            ${{ runner.temp }}/build/*.bin
            ${{ runner.temp }}/build/*.txt
            !${{ runner.temp }}/build/arduino-cli-merged.bin
          if-no-files-found: error

      - name: Upload LittleFS image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: AcidDripS3-littlefs
          path: ${{ runner.temp }}/littlefs/littlefs.bin
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Publish the numbers on the run page
        if: always()
        run: |
          # Two budgets have to be watched for the whole project, and both are
          # invisible until you go looking: the 1 MB app partition (currently
          # ~806 KB for the upstream AcidBox baseline) and the 3 MB LittleFS
          # partition (currently nearly full of drum kits). Putting them on
          # the run page means a M1-M4 change that overspends shows up as a
          # number on the run that caused it, not three milestones later on
          # the bench.
          # arduino-cli's "Sketch uses N bytes" counts the sketch, not the
          # image: the .bin also carries the image header and segment padding,
          # and comes out ~156 bytes larger. Only the .bin size decides whether
          # app0 overflows, so budget against the file and keep arduino's
          # number as a second column rather than quietly reporting the
          # smaller one. Parsed from the log because this step runs on failure
          # too, when there is no file to stat.
          app_max=1048576
          app_sketch=$(grep -oE 'Sketch uses [0-9]+ bytes' build.log | grep -oE '[0-9]+' | head -1 || true)
          app_bin="${{ runner.temp }}/build/firmware.bin"
          if [ -f "$app_bin" ]; then
            app_used=$(stat -c%s "$app_bin")
          else
            app_used="$app_sketch"
          fi

          {
            echo "### Flash budgets"
            echo
            echo "| region | limit | used | free |"
            echo "|---|---|---|---|"
            if [ -n "${app_used:-}" ]; then
              echo "| app0 (noota_3g) | $app_max | $app_used | $((app_max - app_used)) |"
            else
              echo "| app0 (noota_3g) | $app_max | build failed | - |"
            fi
            if [ -n "${FS_CONTENT_BLOCKS:-}" ]; then
              echo "| $FS_PARTITION_LABEL samples (LittleFS) | $FS_PARTITION_SIZE | $FS_CONTENT_BLOCKS | $((FS_PARTITION_SIZE - FS_CONTENT_BLOCKS)) |"
            else
              echo "| $FS_PARTITION_LABEL samples (LittleFS) | $FS_PARTITION_SIZE | no image | - |"
            fi
            echo
            echo "app0 used is the size of firmware.bin, which is what has to fit."
            if [ -n "${app_sketch:-}" ] && [ "${app_sketch:-}" != "${app_used:-}" ]; then
              echo "arduino-cli separately reports \"Sketch uses $app_sketch bytes\"; the"
              echo "$((app_used - app_sketch))-byte difference is the image header and"
              echo "segment padding, and it is the larger number that has to fit."
            fi
            echo
            echo "LittleFS free is sample bytes only: mklittlefs pads littlefs.bin out to"
            echo "the full $FS_PARTITION_SIZE bytes, so the image size itself never shrinks."
            echo "The real figure also has to cover inodes and directory blocks, so treat"
            echo "this as an upper bound."
            echo
            echo '```'
            grep -E 'Sketch uses|Global variables' build.log || echo "(not in log)"
            echo '```'
            echo
            echo "### Files in AcidDripS3-firmware"
            echo
            echo "| file | bytes | sha256 (first 16) |"
            echo "|---|---|---|"
            bundle="${{ runner.temp }}/build"
            if [ -d "$bundle" ]; then
              for f in "$bundle"/*.bin "$bundle"/*.txt; do
                [ -e "$f" ] || continue
                # arduino-cli-merged.bin stays in the build dir so the merge
                # step can cross-check offsets against it, but the artifact
                # excludes it. Listing it here would send people hunting for a
                # file the download does not contain.
                case "$(basename "$f")" in
                  arduino-cli-merged.bin) continue ;;
                esac
                echo "| $(basename "$f") | $(stat -c%s "$f") | $(sha256sum "$f" | cut -c1-16) |"
              done
            else
              echo "| (build failed, no bundle) | - | - |"
            fi
            echo
            echo "Sizes here are real bytes, not the compressed artifact size."
            echo "Browser flashing needs bootloader + partitions + boot_app0 + firmware"
            echo "at 0x0 / 0x8000 / 0xe000 / 0x10000, plus littlefs.bin at 0x110000"
            echo "from the other artifact -- or just the single 4 MiB merged.bin"
            echo "at 0x0, which already contains all of them."
          } >> "$GITHUB_STEP_SUMMARY"
